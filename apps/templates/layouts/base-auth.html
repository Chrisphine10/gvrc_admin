<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B4A28">

  <title>{% block title %} Sign in {% endblock %} &middot; Hodi</title>

  <link rel="icon" href="/static/assets/img/icons/common/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/static/assets/img/brand/hodi-logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <!-- Icons -->
  <link rel="stylesheet" href="/static/assets/vendor/nucleo/css/nucleo.css" type="text/css">
  <link rel="stylesheet" href="/static/assets/vendor/@fortawesome/fontawesome-free/css/all.min.css" type="text/css">

  <!-- Argon CSS, the old auth styles, then the Hodi design system -->
  <link rel="stylesheet" href="/static/assets/css/argon.css?v=1.2.0" type="text/css">
  <link rel="stylesheet" href="/static/assets/css/gvrc-auth.css" type="text/css">
  <link rel="stylesheet" href="/static/assets/css/hodi-theme.css?v=2.0.2" type="text/css">

  <style>
    /* Auth pages: calm page, one white card, brand strip on top. */
    body.hodi-auth { background: var(--page); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    body.hodi-auth::before { display: none; }
    .auth-top { background: var(--hodi-primary-dark); }
    .auth-top .inner { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .auth-top a.brand { color: #fff; font-weight: 800; font-size: 1.125rem; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
    .auth-top a.brand img { width: 32px; height: 32px; border-radius: 8px; background: #fff; padding: 2px; }
    .auth-top .crisis { color: rgba(255,255,255,.88); font-size: .8125rem; }
    .auth-top .crisis a { color: #c9ec92; font-weight: 700; }
    .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
    .auth-main > .container { min-height: 0 !important; padding: 0; }
    .auth-main > .container > .row { margin: 0; }
    .auth-wrap { width: 100%; max-width: 440px; margin: 0 auto; }

    .gvrc-auth-card { background: #fff !important; backdrop-filter: none; border: 1px solid var(--line) !important; border-radius: 14px !important; box-shadow: 0 8px 24px rgba(16,40,24,.08) !important; overflow: hidden; }
    .gvrc-auth-card .card-header { background: #fff !important; border-bottom: 1px solid var(--line) !important; padding: 28px 28px 20px !important; text-align: center; }
    .gvrc-auth-card .card-body { padding: 24px 28px 28px !important; }
    .gvrc-logo-container { margin: 0 0 4px; }
    .gvrc-logo-container img { width: 160px !important; height: auto; margin: 0 auto .25rem !important; display: block; }
    .auth-title, .gvrc-brand-text { font-size: 1.375rem !important; font-weight: 700 !important; color: var(--ink) !important; margin: 4px 0 2px !important; letter-spacing: -.01em; }
    .gvrc-brand-subtitle { color: var(--muted) !important; font-size: .875rem !important; margin: 0 !important; font-weight: 500; }
    .gvrc-auth-card h3.text-dark { font-size: 1.125rem; }

    .gvrc-form-group { margin-bottom: 18px !important; opacity: 1 !important; transform: none !important; animation: none !important; }
    .gvrc-form-group label { display: block; font-size: .8125rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .gvrc-input-group { background: #fff !important; border: 1px solid var(--line-strong) !important; border-radius: 8px !important; box-shadow: none !important; flex-wrap: nowrap; }
    .gvrc-input-group:focus-within { border-color: var(--hodi-primary) !important; box-shadow: var(--focus) !important; }
    .gvrc-input-group.has-error { border-color: var(--bad) !important; }
    .gvrc-input-group .input-group-text { background: transparent !important; border: 0 !important; color: var(--muted) !important; font-size: .9375rem !important; }
    .gvrc-input-group .form-control { border: 0 !important; background: transparent !important; padding: .625rem .75rem .625rem 0 !important; font-size: .9375rem !important; min-height: 42px; box-shadow: none !important; }
    .gvrc-input-group .pw-toggle { cursor: pointer; border-radius: 0 8px 8px 0 !important; }
    .gvrc-input-group .pw-toggle:focus-visible { outline: 2px solid var(--hodi-primary); outline-offset: -2px; }
    .field-error { display: block; margin-top: 6px; color: var(--bad); font-size: .8125rem; font-weight: 500; }
    .small-link { font-size: .8125rem; font-weight: 600; }

    .gvrc-btn-primary { background: var(--hodi-primary) !important; border: 0 !important; border-radius: 8px !important; padding: .75rem 1rem !important; font-size: .9375rem !important; font-weight: 600 !important; color: #fff !important; transform: none !important; box-shadow: none !important; }
    .gvrc-btn-primary:hover { background: var(--hodi-primary-dark) !important; }
    .gvrc-btn-primary:focus-visible { outline: 2px solid var(--hodi-primary-dark); outline-offset: 2px; }
    .gvrc-btn-primary i { margin-right: 6px; }
    .gvrc-checkbox { margin: 4px 0 20px !important; }
    .gvrc-checkbox label { color: var(--ink-2) !important; font-weight: 500; }

    .gvrc-alert { border-radius: 8px !important; padding: .75rem 1rem !important; font-size: .875rem; margin-bottom: 16px !important; border: 1px solid transparent !important; }
    .gvrc-alert i { margin-right: 6px; }
    .gvrc-alert-success { background: var(--ok-bg) !important; color: #124d22 !important; border-color: #b7dfc1 !important; }
    .gvrc-alert-danger, .gvrc-alert-error { background: var(--bad-bg) !important; color: #7a1610 !important; border-color: #f4bcb7 !important; }
    .gvrc-alert-info, .gvrc-alert-warning { background: var(--info-bg) !important; color: #12357a !important; border-color: #bdd0f5 !important; }
    .gvrc-alert-warning { background: var(--warn-bg) !important; color: #5c3200 !important; border-color: #f3d39b !important; }

    .auth-alt { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: .875rem; }
    .auth-alt a { font-weight: 600; }
    .auth-back { text-align: center; margin: 18px 0 0; font-size: .875rem; }
    .auth-back a { color: var(--muted); font-weight: 600; }
    .auth-back a:hover { color: var(--hodi-primary-dark); }
    .gvrc-footer-links a { color: var(--hodi-primary) !important; }
    .auth-foot { text-align: center; padding: 20px 16px 28px; color: var(--muted); font-size: .8125rem; }
    .auth-foot a { color: var(--muted); }

    /* Auth toasts sit bottom-left, above the footer */
    .toast-container { left: 16px; right: auto; }
    .toast-container .toast { transform: none; }
    @media (max-width: 575.98px) {
      .gvrc-auth-card .card-header, .gvrc-auth-card .card-body { padding-left: 20px !important; padding-right: 20px !important; }
      .auth-top .crisis { display: none; }
      .toast-container { right: 16px; }
    }
  </style>

  <!-- Specific CSS goes HERE -->
  {% block stylesheets %}{% endblock stylesheets %}
</head>

<body class="hodi-auth gvrc-auth-bg">
  <header class="auth-top">
    <div class="inner">
      <a class="brand" href="{% url 'landing' %}"><img src="/static/assets/img/brand/hodi-logo.png" alt="" width="32" height="32"> Hodi</a>
      <span class="crisis">Need help now? Call <a href="tel:1195">1195</a> (free, 24/7)</span>
    </div>
  </header>

  <main class="auth-main main-content" id="main">
    {% block content %}{% endblock content %}
  </main>

  <footer class="auth-foot">
    &copy; {% now "Y" %} Hodi &middot; GBV help directory for Kenya &middot; <a href="{% url 'landing' %}">Home</a>
  </footer>

  <!-- Toast Container for left-bottom positioned notifications -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <!-- Core JS -->
  <script src="/static/assets/vendor/jquery/dist/jquery.min.js"></script>
  <script src="/static/assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Toast Notification JavaScript -->
  <script>
    // Toast notification system for authentication pages
    class AuthToastManager {
      constructor() {
        this.container = document.getElementById('toast-container');
        this.toasts = [];
      }

      show(message, type = 'info', title = null, duration = 5000) {
        const toast = this.createToast(message, type, title, duration);
        this.container.appendChild(toast);
        this.toasts.push(toast);
        if (duration > 0) {
          this.startProgressBar(toast, duration);
          setTimeout(() => { this.dismiss(toast); }, duration);
        }
        return toast;
      }

      createToast(message, type, title, duration) {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        const iconMap = { success: 'fas fa-check-circle', error: 'fas fa-exclamation-circle', warning: 'fas fa-exclamation-triangle', info: 'fas fa-info-circle' };
        const titleMap = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Information' };
        const header = document.createElement('div');
        header.className = 'toast-header';
        const icon = document.createElement('i');
        icon.className = `${iconMap[type] || iconMap.info} toast-icon`;
        icon.setAttribute('aria-hidden', 'true');
        const heading = document.createElement('h6');
        heading.className = 'toast-title';
        heading.textContent = title || titleMap[type] || titleMap.info;
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Dismiss');
        close.innerHTML = '<i class="fas fa-times" aria-hidden="true"></i>';
        close.addEventListener('click', () => this.dismiss(toast));
        header.append(icon, heading, close);
        const body = document.createElement('p');
        body.className = 'toast-message';
        body.textContent = message;
        toast.append(header, body);
        if (duration > 0) {
          const bar = document.createElement('div');
          bar.className = 'toast-progress';
          toast.appendChild(bar);
        }
        return toast;
      }

      startProgressBar(toast, duration) {
        const progressBar = toast.querySelector('.toast-progress');
        if (progressBar) {
          progressBar.style.width = '100%';
          progressBar.style.transition = `width ${duration}ms linear`;
          setTimeout(() => { progressBar.style.width = '0%'; }, 10);
        }
      }

      dismiss(toast) {
        if (!toast || !toast.parentNode) return;
        toast.parentNode.removeChild(toast);
        const index = this.toasts.indexOf(toast);
        if (index > -1) this.toasts.splice(index, 1);
      }

      clear() { this.toasts.slice().forEach(toast => this.dismiss(toast)); }
      success(message, title = null, duration = 5000) { return this.show(message, 'success', title, duration); }
      error(message, title = null, duration = 7000) { return this.show(message, 'error', title, duration); }
      warning(message, title = null, duration = 6000) { return this.show(message, 'warning', title, duration); }
      info(message, title = null, duration = 5000) { return this.show(message, 'info', title, duration); }
    }

    const authToastManager = new AuthToastManager();
    window.authToastManager = authToastManager;
    window.showAuthToast = (message, type, title, duration) => authToastManager.show(message, type, title, duration);
  </script>

  <!-- Specific JS goes HERE -->
  {% block javascripts %}{% endblock javascripts %}
</body>
</html>
